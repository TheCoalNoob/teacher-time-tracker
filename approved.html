<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sit-in Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;       
      --primary-dark: #1e40af;
      --success: #10b981;
      --success-bg: #d1fae5;
      --success-text: #065f46;
      --bg-body: #f8fafc;       
      --surface: #ffffff;       
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Navbar --- */
    .navbar {
      background-color: var(--surface);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .nav-btn:hover { background: #f1f5f9; color: var(--text-main); }

    /* --- Main Container --- */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 1.75rem;
      margin: 0;
      color: var(--text-main);
    }

    .page-header p {
      color: var(--text-sub);
      margin-top: 0.5rem;
    }

    /* --- Section Headers & Cards --- */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-live {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .badge-history {
      background-color: #e2e8f0;
      color: var(--text-sub);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0; /* Remove padding for flush table */
      margin-bottom: 2.5rem;
      overflow: hidden; /* For border radius */
      border: 1px solid var(--border);
    }

    /* --- Table Styling --- */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    thead {
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    th {
      text-align: left;
      padding: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8fafc; }

    /* Loading & Empty States */
    #loadingMsg {
      text-align: center;
      color: var(--text-sub);
      padding: 2rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .container { padding: 0 1rem; }
      .page-header h2 { font-size: 1.5rem; }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      TimeTracker
    </a>
    <a href="index.html" class="nav-btn">Back to Home</a>
  </nav>

  <div class="container">
    
    <div class="page-header">
      <h2>Sit-in Records</h2>
      <p>View currently active sessions and historical logs.</p>
    </div>

    <div id="loadingMsg">Loading records...</div>

    <div id="content" style="display: none;">
      
      <div class="section-title">
        Current Sessions
        <span class="badge badge-live">Live</span>
      </div>
      
      <div class="card">
        <div class="table-wrapper">
          <table id="presentTable">
            <thead>
              <tr>
                <th>ID Code</th>
                <th>Student Name</th>
                <th>Year & Section</th>
                <th>Room</th>
                <th>Day</th> <th>Time In</th>
                <th>Time Out</th>
                <th>Purpose</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>
      </div>

      <div class="section-title">
        Past Records
        <span class="badge badge-history">Archive</span>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table id="pastTable">
            <thead>
              <tr>
                <th>ID Code</th>
                <th>Student Name</th>
                <th>Year & Section</th>
                <th>Room</th>
                <th>Day</th> <th>Time In</th>
                <th>Time Out</th>
                <th>Purpose</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="js/approved.js" defer></script>
  
  <script>
    // Simulation Script (Remove if using real backend)
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            document.getElementById("loadingMsg").style.display = "none";
            document.getElementById("content").style.display = "block";
            
            // Empty State Logic
            const presentTableBody = document.querySelector("#presentTable tbody");
            if (presentTableBody && presentTableBody.children.length === 0) {
               // colspan is updated to 8 (7 previous + 1 for Day)
               presentTableBody.innerHTML = `<tr><td colspan="8" class="empty-state">No active sessions found.</td></tr>`;
            }
        }, 800);
    });
  </script>
</body>
</html>
