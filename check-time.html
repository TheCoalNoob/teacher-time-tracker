<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Teacher Schedules</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1f2937;
      --text-light: #6b7280;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px; /* Wide container for the table */
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 24px;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    /* Table Styling */
    .table-wrapper {
      width: 100%;
      overflow-x: auto; /* Horizontal scroll on mobile */
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      white-space: nowrap; /* Prevents awkward wrapping */
    }

    thead th {
      text-align: left;
      padding: 12px 16px;
      background-color: #f9fafb;
      color: var(--text-light);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    tbody tr {
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f9fafb;
    }

    td {
      padding: 14px 16px;
      color: var(--text-main);
    }

    /* Empty state styling */
    .empty-message {
      text-align: center;
      color: var(--text-light);
      padding: 30px;
      font-style: italic;
    }

    /* Button Styling */
    button {
      padding: 12px 24px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
      background-color: white;
      color: var(--text-main);
    }

    button:hover {
      background-color: var(--bg-color);
    }

    @media (max-width: 768px) {
      .container { padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Teacher Schedules</h2>

    <div class="table-wrapper">
      <table id="schedule-table">
        <thead>
          <tr>
            <th>EDP Code</th>
            <th>Teacher</th>
            <th>Course Subject</th>
            <th>Room</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Days</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

    <button onclick="location.href='index.html'">Back to Home</button>
  </div>

<script type="module">
  import { getSchedules } from "./js/main.js";

  const tableBody = document.querySelector("#schedule-table tbody");

  // Assuming getSchedules uses a callback pattern
  getSchedules((schedules) => {
    tableBody.innerHTML = ""; // Clear existing content

    if (!schedules || schedules.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="7" class="empty-message">No schedules found.</td></tr>`;
    } else {
      schedules.forEach((s) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${s.edp}</td>
          <td>${s.teacher}</td>
          <td>${s.subject}</td>
          <td>${s.room}</td>
          <td>${s.start}</td>
          <td>${s.end}</td>
          <td>${s.days}</td>
        `;
        tableBody.appendChild(row);
      });
    }
  });
</script>
</body>
</html>
