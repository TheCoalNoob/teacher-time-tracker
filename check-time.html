<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Schedules - Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;       
      --primary-dark: #1e40af;
      --bg-body: #f8fafc;       
      --surface: #ffffff;       
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Navbar --- */
    .navbar {
      background-color: var(--surface);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .nav-btn:hover { background: #f1f5f9; color: var(--text-main); }

    /* --- Main Container --- */
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 1.75rem;
      margin: 0;
      color: var(--text-main);
    }

    .page-header p {
      color: var(--text-sub);
      margin-top: 0.5rem;
    }

    /* --- Search Bar --- */
    .search-wrapper {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem; /* Left padding for icon */
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: inherit;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      pointer-events: none;
    }

    /* --- Card & Table --- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden; /* Clips the table corners */
      border: 1px solid var(--border);
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    thead {
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    th {
      text-align: left;
      padding: 1rem 1.5rem;
      font-weight: 600;
      color: var(--text-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    tr:last-child td { border-bottom: none; }
    
    tr:hover td { background-color: #f8fafc; }

    /* Highlight badge for Room */
    .room-badge {
      background-color: #eff6ff;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* Empty state */
    .empty-message {
      text-align: center;
      color: var(--text-sub);
      padding: 3rem;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .container { padding: 0 1rem; }
      .page-header h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      TimeTracker
    </a>
    <a href="index.html" class="nav-btn">Back to Home</a>
  </nav>

  <div class="container">
    
    <div class="page-header">
      <h2>Teacher Schedules</h2>
      <p>Search for faculty members, subjects, or EDP codes.</p>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by Teacher, Subject, or EDP Code..." />
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table id="schedule-table">
          <thead>
            <tr>
              <th>EDP Code</th>
              <th>Teacher</th>
              <th>Course Subject</th>
              <th>Room</th>
              <th>Time</th>
              <th>Days</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>
    </div>

  </div>

<script type="module">
  import { getSchedules } from "./js/main.js";

  const tableBody = document.querySelector("#schedule-table tbody");
  const searchInput = document.getElementById("searchInput");
  let allSchedules = []; // Store data for searching

  // Fetch and Render
  getSchedules((schedules) => {
    allSchedules = schedules || [];
    renderTable(allSchedules);
  });

  // Render Function
  function renderTable(data) {
    tableBody.innerHTML = ""; // Clear content

    if (data.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="6" class="empty-message">No schedules found matching your search.</td></tr>`;
      return;
    }

    data.forEach((s) => {
      const row = document.createElement("tr");
      const timeRange = `${s.start} - ${s.end}`;
      
      row.innerHTML = `
        <td><strong>${s.edp}</strong></td>
        <td>${s.teacher}</td>
        <td>${s.subject}</td>
        <td><span class="room-badge">${s.room}</span></td>
        <td>${timeRange}</td>
        <td>${s.days}</td>
      `;
      tableBody.appendChild(row);
    });
  }

  // Search Logic (Real-time filtering)
  searchInput.addEventListener("keyup", (e) => {
    const term = e.target.value.toLowerCase();
    
    const filtered = allSchedules.filter(s => 
      s.teacher.toLowerCase().includes(term) ||
      s.subject.toLowerCase().includes(term) ||
      s.edp.toLowerCase().includes(term) ||
      s.room.toLowerCase().includes(term)
    );

    renderTable(filtered);
  });
</script>
</body>
</html>
