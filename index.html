<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Time Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>
</head>

<body>
  <div class="container">
    <h1>Teacher Time Tracker</h1>
    <h3 id="datetime"></h3>

    <div class="buttons">
      <button id="btnCheck">Check Teacher's Time</button>
      <button id="btnSitin">Apply for Sit-in</button>
      <button id="btnApproved">View Approved Sit-ins</button>
    </div>

    <div class="admin-login">
      <button id="btnAdmin">Admin Login</button>
    </div>
  </div>

  <script>
    /* -------------------------------
       Live Philippine Time Clock
    --------------------------------*/
    function updateDateTime() {
      const now = new Date().toLocaleString("en-PH", {
        timeZone: "Asia/Manila",
        hour12: true
      });
      document.getElementById("datetime").textContent = now;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    /* -------------------------------
       Navigation buttons (Cleaner)
    --------------------------------*/
    document.getElementById("btnCheck").addEventListener("click", () => {
      location.href = "check-time.html";
    });

    document.getElementById("btnSitin").addEventListener("click", () => {
      location.href = "apply-sitin.html";
    });

    document.getElementById("btnApproved").addEventListener("click", () => {
      location.href = "approved.html";
    });

    /* -------------------------------
       Admin Login
    --------------------------------*/
    document.getElementById("btnAdmin").addEventListener("click", () => {
      const username = prompt("Enter username:");
      const password = prompt("Enter password:");

      if (username === "admin" && password === "ilovecisco") {
        location.href = "admin.html";
      } else {
        alert("Invalid credentials!");
      }
    });
  </script>
</body>
</html>
