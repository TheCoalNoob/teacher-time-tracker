<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - Manage Schedules</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;       
      --primary-dark: #1e40af;
      --danger: #ef4444;
      --bg-body: #f8fafc;       
      --surface: #ffffff;       
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Navbar --- */
    .navbar {
      background-color: var(--surface);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .nav-btn:hover { background: #f1f5f9; color: var(--text-main); }

    /* --- Main Container --- */
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 1.75rem;
      margin: 0;
      color: var(--text-main);
    }

    .page-header p {
      color: var(--text-sub);
      margin-top: 0.5rem;
    }

    /* --- Card Style --- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    /* --- Form Grid --- */
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 0.5rem;
    }

    .form-group input, 
    .form-group select {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .full-width { grid-column: 1 / -1; }

    /* Buttons */
    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-primary:hover { background-color: var(--primary-dark); }

    .btn-delete {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* --- Table Styling --- */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    thead { background-color: #f8fafc; }

    th {
      text-align: left;
      padding: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem;
      border-top: 1px solid var(--border);
      color: var(--text-main);
    }

    tr:hover td { background-color: #f8fafc; }

    /* --- Toast Notification --- */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 12px;
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }

    @media (max-width: 600px) {
      .container { padding: 0 1rem; }
      .page-header h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      TimeTracker Admin
    </a>
    <a href="index.html" class="nav-btn">Sign Out</a>
  </nav>

  <div class="container">
    
    <div class="page-header">
      <h2>Manage Schedules</h2>
      <p>Add new classes or remove existing schedules from the database.</p>
    </div>

    <div class="card">
      <form id="scheduleForm">
        <div class="form-group">
          <label for="edp">EDP Code</label>
          <input type="text" id="edp" placeholder="e.g. 12345" required />
        </div>

        <div class="form-group">
          <label for="teacher">Teacher Name</label>
          <input type="text" id="teacher" placeholder="e.g. John Doe" required />
        </div>

        <div class="form-group">
          <label for="subject">Course Subject</label>
          <input type="text" id="subject" placeholder="e.g. ITE 101" required />
        </div>

        <div class="form-group">
          <label for="room">Assigned Room</label>
          <select id="room" required>
            <option value="">Select Room...</option>
            <option value="419G">419G (Lab 1)</option>
            <option value="430">430 (Lab 2)</option>
            <option value="431">431 (Lab 3)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="days">Days</label>
          <input type="text" id="days" placeholder="MWF / TTH" required />
        </div>

        <div class="form-group">
          <label for="start">Start Time</label>
          <input type="time" id="start" required />
        </div>

        <div class="form-group">
          <label for="end">End Time</label>
          <input type="time" id="end" required />
        </div>

        <div class="form-group full-width">
          <button type="submit" class="btn-primary">Add New Schedule</button>
        </div>
      </form>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <div class="table-container">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>EDP</th>
              <th>Teacher</th>
              <th>Subject</th>
              <th>Room</th>
              <th>Days</th>
              <th>Time</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast">Operation Successful</div>

  <script type="module">
    import { saveSchedule, getSchedules, deleteSchedule } from "./js/main.js";

    const form = document.getElementById("scheduleForm");
    const tableBody = document.querySelector("#scheduleTable tbody");

    // UI Helper: Show Toast
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // UI Helper: Load Table
    function loadSchedules() {
      // Use callback or Promise depending on your main.js implementation
      // This assumes callback pattern from your previous code
      getSchedules((schedules) => {
        tableBody.innerHTML = "";
        
        if (!schedules || schedules.length === 0) {
           tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:30px;">No schedules available. Add one above.</td></tr>`;
           return;
        }

        schedules.forEach((s) => {
          const row = document.createElement("tr");
          
          // Format time range for cleaner display
          const timeRange = `${s.start} - ${s.end}`;

          row.innerHTML = `
            <td><strong>${s.edp}</strong></td>
            <td>${s.teacher}</td>
            <td>${s.subject}</td>
            <td><span style="background:#eff6ff; color:#2563eb; padding:4px 8px; border-radius:4px; font-size:0.85rem; font-weight:600;">${s.room}</span></td>
            <td>${s.days}</td>
            <td>${timeRange}</td>
            <td><button class="btn-delete" onclick="handleDelete('${s.id}')">Remove</button></td>
          `;
          tableBody.appendChild(row);
        });
      });
    }

    // Handle Form Submit
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      
      const schedule = {
        edp: form.edp.value,
        teacher: form.teacher.value,
        subject: form.subject.value,
        room: form.room.value,
        start: form.start.value,
        end: form.end.value,
        days: form.days.value,
      };

      saveSchedule(schedule);
      form.reset();
      showToast("Schedule Added Successfully!");
      loadSchedules(); // Refresh table
    });

    // Handle Delete (Attached to window for global access)
    window.handleDelete = (id) => {
      if(confirm("Are you sure you want to remove this schedule?")) {
        deleteSchedule(id);
        showToast("Schedule Removed");
        loadSchedules(); // Refresh table
      }
    };

    // Initial Load
    loadSchedules();
  </script>
</body>
</html>
