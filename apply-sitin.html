<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply for Sit-in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1f2937;
      --text-light: #6b7280;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px; /* Narrower container for a clean form look */
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 24px;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    input, select {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background-color: #fff;
      font-family: inherit;
      width: 100%; /* Ensure inputs fill the container */
      box-sizing: border-box; /* Fix padding issues */
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Grid for time inputs to sit side-by-side */
    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      font-size: 0.95rem;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: white;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 100%;
    }

    .btn-secondary:hover {
      background-color: var(--bg-color);
    }

    @media (max-width: 480px) {
      .container { padding: 24px; }
      .time-row { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Apply for Sit-in</h2>

    <form id="sitinForm">
      
      <div class="form-group">
        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="e.g. Juan Dela Cruz" required>
      </div>

      <div class="form-group">
        <label for="year">Year & Section</label>
        <input type="text" id="year" placeholder="e.g. BSIT 3-A" required>
      </div>

      <div class="form-group">
        <label for="room">Laboratory Room</label>
        <select id="room" required>
          <option value="">Select Room</option>
          <option value="419G">419G</option>
          <option value="430">430</option>
          <option value="431">431</option>
        </select>
      </div>

      <div class="time-row">
        <div class="form-group">
          <label for="startTime">Start Time</label>
          <input type="time" id="startTime" required>
        </div>
        <div class="form-group">
          <label for="endTime">End Time</label>
          <input type="time" id="endTime" required>
        </div>
      </div>

      <div class="form-group">
        <label for="purpose">Purpose</label>
        <input type="text" id="purpose" placeholder="e.g. C++ Programming Activity" required>
      </div>

      <button type="submit" class="btn-primary">Submit Application</button>
    </form>

    <button class="btn-secondary" onclick="location.href='index.html'">Back to Home</button>
  </div>

  <script type="module" src="js/apply-sitin.js" defer></script>
</body>
</html>
